<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0px;
            background-color: black;
        }
        .contenedor{
            width: 100%;
            height: 100vh;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;   /* 1fr */
            gap: 20px;
        }
        .contenedor div{
            cursor: pointer; /* Modifica puntero*/
            transition: 0.3s; /* Animacion boton*/
            background-color: black;
            filter: saturate(30%);

        }
        .contenedor div:hover{
            scale: 1.02;
            opacity: 100%;
            filter: sepia(0%)
        }
        .contenedor div:active{
            background-color: brown;
            scale: 1.03;
            font-size: 31px;
        }
        .contenido{
            border-radius: 20px;

        }

        #primero{
            grid-column: 1/2;
            grid-row: 1/3;
        }
        
        #primero img{
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
        }

        #segundo{
            grid-column: 2/3;
            grid-row: 1/2;
        }
        #segundo img{
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
        }
        #tercero{
            grid-column: 3/4;
            grid-row: 1/2;
        }
        #tercero img{
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px; 
        }
        #cuarto{
            grid-column: 2/3;
            grid-row: 2/3;
        }
        #cuarto img{
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;    
        }
        #quinto{
            grid-column: 1/2;
            grid-row: 3/4;
        }
        #quinto img{
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
        }
        #sexto{
            grid-column: 2/3;
            grid-row: 3/4
        }
        #sexto img{
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
        }
        #septimo{
            grid-column: 3/4;
            grid-row: 2/4;
        }
        #septimo img{
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
        }


    </style>
</head>
<body>
    <div class="contenedor">
        <div class="contenido" id="primero">
            <img src="https://i.pinimg.com/736x/56/d5/03/56d50354aeba579b88645206b55e71d1.jpg">
        </div>
        <div class="contenido" id="segundo">
            <img src="https://media.kasperskydaily.com/wp-content/uploads/sites/87/2021/06/09160131/minecraft-mod-adware-google-play-revisited-featured.jpg">
        </div>
         <div class="contenido" id="tercero">
            <img src="https://files.tecnoblog.net/wp-content/uploads/2020/11/como-jogar-minecraft-1060x596.jpg">
        </div>
        <div class="contenido" id="cuarto">
            <img src="https://www.designyourway.net/blog/wp-content/uploads/2024/11/Minecraft-Logo-featured.jpg">
        </div>
        <div class="contenido" id="quinto">
            <img src="https://gaming-cdn.com/images/news/articles/11862/cover/1000x563/la-pelicula-de-minecraft-ha-hecho-subir-el-numero-de-jugadores-cover67f8ced97a769.jpg">
        </div>
        <div class="contenido" id="sexto">
            <img src="https://static.giga.de/9c/62/c0/944c6bca272c5727768635fbb2_cmUgMTY4MCA5NDQDOTI5Y2M3NTc4NWI=.png">
        </div>
        <div class="contenido" id="septimo">
            <img src="https://media.gq.com.mx/photos/661c26b3958f2e7fe1e3e42c/2:3/w_1200,h_1800,c_limit/minecraft.jpg">
        </div>
    </div>
</body>
</html>
