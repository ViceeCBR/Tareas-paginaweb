<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        height: 100px;
        width: 100px;
    }
    #objeto{
        position: relative;
        background-color: black;
        border-radius: 50%;
        width: 100px;
        height: 100px;
    }
</style>
<body>
    <div id="objeto"></div>
    <script>
        const objeto = document.getElementById('objeto')
 objeto.addEventListener('mouseenter', function() {
//  objeto.addEventListener('mousemove', function() {
            const colorAleatorio = "#" + Math.floor(Math.random() * 16777215).toString(16);
            objeto.style.backgroundColor = colorAleatorio;
        })
        
    </script>
</body>
</html>
